databases:
  - name: traceflow-db
    plan: free
    databaseName: traceflow
    user: trace

services:
  - type: web
    name: traceflow
    runtime: docker
    plan: free
    dockerfilePath: ./TraceFlow/Dockerfile
    dockerContext: ./TraceFlow
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: traceflow-db
          property: connectionString
