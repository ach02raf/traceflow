services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: traceflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d traceflow"]
      interval: 5s
      retries: 10

  app:
    build: ./TraceFlow
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Default: "Host=db;Database=traceflow;Username=trace;Password=trace"
    ports: ["8080:8080"]

volumes:
  pgdata:
